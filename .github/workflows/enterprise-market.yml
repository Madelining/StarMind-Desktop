name: Enterprise Plugin Market

on:
  push:
    branches: [feat/enterprise-plugin-market]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-market-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  market-service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.23.2, 24.21.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Test service, browser contracts and real npm offline preparation
        run: node --test enterprise-market/test/*.test.mjs enterprise-market/tests/*.test.mjs

  desktop:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: enterprise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', 'deepseek-harness/scripts/primary-runtime/lock.json', 'dsh-plugin-desktop-beta/package.json') }}
          restore-keys: |
            installer-downloads-${{ runner.os }}-${{ runner.arch }}-
            enterprise-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: yarn install --immutable
      - name: Verify Beta and Next boundaries
        run: yarn check:desktop-variants
      - name: Build bundled community market before Host checks
        run: yarn workspace dsh-community-market build
      - name: Validate Beta product
        run: yarn workspace dsh-plugin-desktop-beta check
      - name: Validate Next product
        run: yarn workspace dsh-desktop-next check
      - name: Verify real Host install, update, restart and removal against the private registry
        run: node dsh-plugin-desktop-beta/scripts/verify-enterprise-market.mjs
      - name: Verify Windows packaging
        run: yarn workspace dsh-plugin-desktop-beta check:win-package:platform
      - name: Build Windows x64 installer
        env:
          DSH_BETA_BUILD_VERSION: 2.0.21-beta.2
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_WINDOWS_PACKAGE_COMPRESSION: normal
        run: yarn workspace dsh-plugin-desktop-beta dist:win
      - name: Collect client installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath 'dsh-plugin-desktop-beta/dist' -Filter '*-x64-Setup.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $out = Join-Path $env:RUNNER_TEMP 'enterprise-client'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination $out
          $digest = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($files[0].Name)" | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding utf8NoBOM
          [ordered]@{version='2.0.21-beta.2'; sourceCommit=$env:GITHUB_SHA; sourceRef=$env:GITHUB_REF; installer=$files[0].Name; sha256=$digest; signed=$false; enterpriseMarketImplemented=$true; workflowRun="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $out 'build-info.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          name: StarMind-Enterprise-Market-Windows-Client-${{ github.run_number }}
          path: ${{ runner.temp }}/enterprise-client
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

  market-windows-delivery:
    needs: market-service
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Assemble standalone offline service with Node and npm
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'StarMind-Market-Server-Windows-x64'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -Path 'enterprise-market/*' -Destination $out -Recurse
          $runtime = Join-Path $out 'runtime'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          $nodeHome = Split-Path (Get-Command node).Source
          foreach ($name in @('node.exe', 'LICENSE', 'node_modules')) {
            $source = Join-Path $nodeHome $name
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $runtime -Recurse }
          }
          if (!(Test-Path -LiteralPath (Join-Path $runtime 'node.exe'))) { throw 'Missing Node executable' }
          if (!(Test-Path -LiteralPath (Join-Path $runtime 'node_modules/npm/bin/npm-cli.js'))) { throw 'Missing bundled npm for offline preparation' }
          if (!(Test-Path -LiteralPath (Join-Path $runtime 'LICENSE'))) { throw 'Missing Node license' }
          if (!(Test-Path -LiteralPath (Join-Path $runtime 'node_modules/npm/LICENSE'))) { throw 'Missing npm license' }
          $npmVersion = & (Join-Path $runtime 'node.exe') (Join-Path $runtime 'node_modules/npm/bin/npm-cli.js') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled npm cannot run' }
          # Verify the copied delivery in isolation, so tests cannot accidentally depend on
          # another directory in the repository or a preinstalled server dependency.
          Push-Location $out
          try {
            & '.\runtime\node.exe' --test 'test/*.test.mjs' 'tests/*.test.mjs'
            if ($LASTEXITCODE -ne 0) { throw 'Standalone delivery validation failed' }
            & '.\runtime\node.exe' 'tools/prepare-offline.mjs' --help
            if ($LASTEXITCODE -ne 0) { throw 'Bundled preparation tool cannot run' }
          } finally { Pop-Location }
          $receipt = [ordered]@{sourceCommit=$env:GITHUB_SHA; nodeVersion=(node --version); npmVersion="$npmVersion"; platform='win32'; arch='x64'; installRequired=$false; runtimeDependenciesVendored=$true; standaloneTestsPassed=$true}
          $receipt | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $out 'build-info.json') -Encoding utf8NoBOM
          Get-ChildItem -LiteralPath $out -Recurse -File | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($out, $_.FullName).Replace('\', '/')
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          name: StarMind-Market-Server-Windows-x64-${{ github.run_number }}
          path: ${{ runner.temp }}/StarMind-Market-Server-Windows-x64
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

  release:
    needs: [desktop, market-windows-delivery]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: StarMind-Enterprise-Market-Windows-Client-${{ github.run_number }}
          path: client
      - uses: actions/download-artifact@v6
        with:
          name: StarMind-Market-Server-Windows-x64-${{ github.run_number }}
          path: StarMind-Market-Server-Windows-x64
      - name: Publish the verified Windows deliveries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'enterprise-market-${{ github.run_number }}'
          $out = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $installers = @(Get-ChildItem -LiteralPath 'client' -Filter '*-x64-Setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one verified client installer' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $out
          Copy-Item -LiteralPath 'client/build-info.json' -Destination (Join-Path $out 'client-build-info.json')
          $serverZip = Join-Path $out 'StarMind-Market-Server-Windows-x64.zip'
          Compress-Archive -LiteralPath 'StarMind-Market-Server-Windows-x64' -DestinationPath $serverZip
          $assets = @(Get-ChildItem -LiteralPath $out -File)
          $assets | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding utf8NoBOM
          $notes = @"
          StarMind 2.0.21-beta.2 企业插件市场测试版，Windows x64，安装包未签名。

          - Setup.exe：安装客户端，在侧栏“企业市场”配置内网地址。
          - Server ZIP：含 Node、npm 和市场全部运行依赖，完整解压后按 README 部署，无需联网 npm install。
          - 支持原始 DSH tgz + 完整依赖上传、离线包导入导出、真实插件管理器安装与版本管理。
          - 插件运行时所需的模型/API/浏览器等外部资源仍需自行提供内网替代；需安装脚本的包应先制作离线预构建版本。

          来源提交：$env:GITHUB_SHA
          本次检查：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          部署说明：https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/enterprise-market/README.md
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'enterprise-release-notes.md'
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM
          $assetPaths = @(Get-ChildItem -LiteralPath $out -File | Select-Object -ExpandProperty FullName)
          gh release create $tag @assetPaths --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'StarMind 企业插件市场 · 2.0.21-beta.2' --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed' }
