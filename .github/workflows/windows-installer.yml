name: StarMind Windows Installer

on:
  push:
    branches: [feat/adt-cpd-workflow-plan]
    paths:
      - .github/workflows/windows-installer.yml
      - .github/windows-installer-request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Windows packaging downloads
        uses: actions/cache@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: installer-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', 'deepseek-harness/scripts/primary-runtime/lock.json', 'dsh-plugin-desktop-beta/package.json') }}
          restore-keys: |
            installer-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install exact workspace dependencies
        run: yarn install --immutable
      - name: Verify desktop variant boundaries
        run: yarn check:desktop-variants
      - name: Run Windows packaging platform checks
        run: yarn workspace dsh-plugin-desktop-beta check:win-package:platform
      - name: Build Windows x64 Setup
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_WINDOWS_PACKAGE_COMPRESSION: normal
        run: yarn workspace dsh-plugin-desktop-beta dist:win
      - name: Collect installer and provenance
        id: collect
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'dsh-plugin-desktop-beta/dist' -Filter '*-x64-Setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows x64 Setup executable, found $($installers.Count)." }
          $out = Join-Path $env:RUNNER_TEMP 'starmind-windows-delivery'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $installer = Join-Path $out $installers[0].Name
          Copy-Item -LiteralPath $installers[0].FullName -Destination $installer
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Content -LiteralPath 'dsh-plugin-desktop-beta/package.json' -Raw | ConvertFrom-Json).version
          $receipt = [ordered]@{
            product = 'StarMind Beta'
            version = $version
            platform = 'win32'
            arch = 'x64'
            sourceCommit = $env:GITHUB_SHA
            sourceRef = $env:GITHUB_REF
            workflowRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            installer = $installers[0].Name
            bytes = (Get-Item -LiteralPath $installer).Length
            sha256 = $digest
            signed = $false
            enterpriseMarketImplemented = $false
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'build-info.json') -Encoding utf8NoBOM
          "$digest  $($installers[0].Name)" | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding utf8NoBOM
          @'
          This is an unsigned Windows x64 installer built from the recorded StarMind source commit.
          The enterprise-market plan and test tools are included in the source repository.
          The production enterprise-market service and client integration are not implemented by this build.
          This is a build artifact, not an official signed production release.
          '@ | Set-Content -LiteralPath (Join-Path $out 'README.txt') -Encoding utf8NoBOM
          "directory=$out" >> $env:GITHUB_OUTPUT
      - name: Upload executable and checksums
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: StarMind-Beta-Windows-x64-${{ github.run_number }}
          path: ${{ steps.collect.outputs.directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Record download location
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "Windows installer: $env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY
