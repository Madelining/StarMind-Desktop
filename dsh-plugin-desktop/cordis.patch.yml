# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name. The later
  # user patch can still disable the Browser explicitly.
  disabled: false

- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# StarMind uses the configured gateway; account sign-in stays an explicit action.
- id: ui-settings-models
  config:
    credentialOnboarding: false

# StarMind deployment identity; providers and model IDs keep their actual names.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: "You are StarMind, an AI assistant that helps people focus and complete tasks. StarMind: 让专注成为一种习惯。"
    personaSuffix: |-
      ## StarMind product identity
      StarMind is your product name and your identity. When asked who you are, introduce yourself as StarMind; in Chinese, begin with "我是 StarMind".
      Do not describe yourself as an upstream framework, runtime, harness, or coding-agent instance. If the user explicitly asks about the underlying technology, discuss it as StarMind's implementation rather than as your identity.
      Do not volunteer internal paths, process names, environment variables, or runtime architecture when answering identity questions.

# StarMind releases are distributed independently from upstream installers.
- id: desktop-updates
  disabled: true
